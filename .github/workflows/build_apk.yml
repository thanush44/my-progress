name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./flutter_app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Clean & Generate Fresh Android Project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example .

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release > build_log.txt 2>&1 || (cat build_log.txt && exit 1)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyProgress-Android-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-Build-Log
          path: flutter_app/build_log.txt
