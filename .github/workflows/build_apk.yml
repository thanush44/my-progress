name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Clean & Generate Fresh Android Project
        run: |
          cd flutter_app
          rm -rf android
          flutter create --platforms=android --org com.example .

      - name: Get Dependencies
        run: |
          cd flutter_app
          flutter pub get

      - name: Build Release APK
        run: |
          cd flutter_app
          flutter build apk --release

      - name: Commit and Push Compiled APK to Main
        run: |
          mkdir -p released_apk
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk released_apk/app-release.apk
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add released_apk/app-release.apk
          git commit -m "Automated build: add app-release.apk [skip ci]" || echo "No changes to commit"
          git push origin main
