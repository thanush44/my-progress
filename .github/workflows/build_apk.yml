name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./flutter_app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Clean & Generate Fresh Android Project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.example .

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyProgress-Android-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to Release Branch
        run: |
          cd ..
          cp flutter_app/build/app/outputs/flutter-apk/app-release.apk app-release.apk
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout --orphan release
          git reset
          git add app-release.apk
          git commit -m "Automated build app-release.apk"
          git push origin release --force
